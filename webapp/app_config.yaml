# Webapp Configuration
app:
  default_mode: "streamlit"  # streamlit or fastapi
  upload_max_mb: 200
  max_files: 500
  default_language: "en"  # en or gr
  default_filter: false
  default_verbose: false

# Security
security:
  allowed_extensions: [".pdf", ".zip"]
  temp_dir_cleanup_interval: 3600  # seconds

# UI Text (Internationalization)
ui_text:
