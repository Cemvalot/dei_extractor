<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEI Extractor Web App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>DEI Extractor Web App</h1>
            <p>Upload PDF files or ZIP archives to extract DEI data</p>
        </header>

        <main>
            <div class="upload-section">
                <div class="upload-zone" id="uploadZone">
                    <div class="upload-content">
                        <div class="upload-icon">📁</div>
                        <h3>Drop files here or click to browse</h3>
                        <p>Supports PDF files and ZIP archives</p>
                        <input type="file" id="fileInput" multiple accept=".pdf,.zip" style="display: none;">
                        <button type="button" class="browse-btn" onclick="document.getElementById('fileInput').click()">
                            Browse Files
                        </button>
                    </div>
                </div>

                <div class="file-list" id="fileList" style="display: none;">
                    <h4>Selected Files:</h4>
                    <ul id="selectedFiles"></ul>
                </div>
            </div>

            <div class="options-section">
                <h3>Processing Options</h3>
                <div class="options-grid">
                    <div class="option">
                        <label class="checkbox-label">
                            <input type="checkbox" id="applyFilter">
                            <span class="checkmark"></span>
                            Keep only Εκαθαριστικός
                        </label>
                    </div>

                    <div class="option">
                        <label class="checkbox-label">
                            <input type="checkbox" id="verbose">
                            <span class="checkmark"></span>
                            Verbose logs
                        </label>
                    </div>

                    <div class="option">
                        <label for="language">Language:</label>
                        <select id="language">
                            <option value="en">English</option>
                            <option value="gr">Greek</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="action-section">
                <button type="button" id="processBtn" class="process-btn" disabled>
                    Process Files
                </button>
            </div>

            <div class="progress-section" id="progressSection" style="display: none;">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p id="progressText">Processing files...</p>
            </div>

            <div class="results-section" id="resultsSection" style="display: none;">
                <h3>Processing Complete</h3>
                <div id="resultsContent"></div>
                <button type="button" id="downloadBtn" class="download-btn">
                    Download Results
                </button>
            </div>

            <div class="error-section" id="errorSection" style="display: none;">
                <div class="error-message" id="errorMessage"></div>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
