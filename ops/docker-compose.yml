services:
  backend:
    build:
      context: ..
      dockerfile: ops/Dockerfile.backend
    environment:
      LOG_LEVEL: INFO
      RETENTION_HOURS: "24"
      MAX_FILES: "50"
      MAX_UPLOAD_MB: "100"
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: ops/Dockerfile.frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      NODE_ENV: production
    depends_on: [backend]
    restart: unless-stopped

  proxy:
    image: caddy:2
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, backend]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
